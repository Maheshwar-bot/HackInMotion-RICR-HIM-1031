<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — MediSafe AI</title>
<link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/auth.css"></head>
<body class="auth-page login-bg">
<div class="auth-shell">
  <section class="auth-brand-side">
    <a class="brand brand-white" href="../index.html"><span class="brand-mark">♡</span>MediSafe <b>AI</b></a>
    <div class="brand-center">
      <div class="heart-logo">♡</div>
      <h1>Smart medicine care,<br><em>beautifully organised.</em></h1>
      <p>Your medicine companion for everyday health information.</p>
    </div>
    <small>Private • Simple • Human-centred</small>
  </section>
  <section class="auth-form-side">
    <a class="back-link" href="../index.html">← Back to home</a>
    <div class="auth-card glass-card">
      <div class="auth-icon">♡</div><h2>Welcome Back</h2><p class="muted">Login to continue to your health space.</p>
      <form id="loginForm" novalidate>
        <label>Email or Phone</label>
        <div class="input-wrap"><span>♙</span><input id="loginEmail" type="text" autocomplete="username" placeholder="you@example.com" required></div>
        <label>Password</label>
        <div class="input-wrap"><span>▣</span><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" class="eye" data-toggle-password="#loginPassword">◉</button></div>
        <div class="form-row"><label class="check"><input id="remember" type="checkbox"> <span>Remember me</span></label><a href="forgot-password.html">Forgot Password?</a></div>
        <button class="btn btn-block" type="submit">Login <span>→</span></button>
      </form>
      <div class="or"><span>or</span></div>
      <div class="social-row"><button type="button" data-demo-social="Google">G</button><button type="button" data-demo-social="Apple">●</button><button type="button" data-demo-social="Email">✉</button></div>
      <p class="auth-footer">Don’t have an account? <a href="create-account.html">Sign Up</a></p>
      <div id="authMessage" class="message" role="status"></div>
    </div>
  </section>
</div>
<script src="../js/auth.js"></script></body></html>
