<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MediSafe - Login
    </title>


    <!-- Shared CSS -->
    <link
        rel="stylesheet"
        href="../CSS/utility.css"
    >


    <!-- Login-specific CSS -->
    <link
        rel="stylesheet"
        href="../CSS/login.css"
    >


    <!-- Lucide Icons -->
    <script
        src="https://unpkg.com/lucide@latest">
    </script>

</head>


<body>

<div class="mobile-app">


    <main class="auth-wrapper login-page">


        <!-- MediSafe Logo -->

        <section class="auth-logo-section">

            <div class="brand-logo auth-big-logo">
                +
            </div>


            <div class="auth-brand">

                Medi<span>Safe</span>

            </div>


            <p class="auth-subtitle">

                Medicine Safety Assistant

            </p>

        </section>



        <!-- Welcome -->

        <h1 class="auth-title">

            Welcome Back!

        </h1>


        <p class="auth-description">

            Login to your account

        </p>



        <!-- Login Form -->

        <form
            class="auth-form"
            id="loginForm"
        >


            <!-- Email -->

            <div class="input-box">

                <i data-lucide="mail"></i>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter email"
                    required
                >

            </div>



            <!-- Password -->

            <div class="input-box">

                <i data-lucide="lock-keyhole"></i>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    required
                >


                <button
                    type="button"
                    class="icon-button password-toggle"
                    id="passwordToggle"
                >

                    <i data-lucide="eye"></i>

                </button>

            </div>



            <!-- Forgot Password -->

            <div class="forgot-container">

                <a href="forgot-password.html">

                    Forgot Password?

                </a>

            </div>



            <!-- Login -->

            <button
                type="submit"
                class="primary-btn"
            >

                Login

            </button>

        </form>



        <!-- OR -->

        <div class="or-divider">

            OR

        </div>



        <!-- Google -->

        <button
            class="google-button"
            id="googleLogin"
        >

            <span class="google-logo">

                G

            </span>

            Continue with Google

        </button>



        <!-- Register -->

        <p class="register-link">

            New user?

            <a href="register.html">

                Create an account

            </a>

        </p>

    </main>

</div>


<script src="js/login.js"></script>

</body>

</html>
